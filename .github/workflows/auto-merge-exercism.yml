name: Auto-merge Exercism sync PRs

"on":
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'exercism-solutions-syncer[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Add co-author trailer to PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          CURRENT_BODY="$(gh pr view "$PR_URL" --json body --jq '.body')"

          if ! printf '%s\n' "$CURRENT_BODY" | grep -Fq \
            'Co-authored-by: iztanos <139579436+iztanos@users.noreply.github.com>'; then

            {
              printf '%s\n\n' "$CURRENT_BODY"
              printf '%s\n' 'Co-authored-by: iztanos <139579436+iztanos@users.noreply.github.com>'
            } > /tmp/pr-body.txt

            gh pr edit "$PR_URL" --body-file /tmp/pr-body.txt
          fi

      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --squash "$PR_URL"
