name: Auto-merge Exercism sync PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-exercism-pr:
    if: >-
      github.event.pull_request.user.login == 'exercism-solutions-syncer[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Print PR diagnostics
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "PR author: $PR_AUTHOR"
          echo "PR URL: $PR_URL"

      - name: Merge Exercism PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" \
            --squash \
            --subject "Sync Exercism solutions" \
            --body "$(cat <<'EOF'
Automated Exercism solution sync.

Co-authored-by: iztanos <139579436+iztanos@users.noreply.github.com>
EOF
)"
