name: Auto-merge Exercism sync PRs

"on":
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'exercism-solutions-syncer[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Participate in PR as iztanos
        env:
          GH_TOKEN: ${{ secrets.IZTANOS_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review "$PR_URL" --comment --body "Exercism sync."

      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" \
            --auto \
            --squash \
            --subject "Sync Exercism solutions" \
            --body $'Co-authored-by: iztanos <139579436+iztanos@users.noreply.github.com>'
